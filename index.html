<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal World Gallery</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sukhumvit Tadmai', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      padding: 20px;
    }

    /* 1. Header Section */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #22c55e;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.1rem;
      color: #94a3b8;
    }

    /* Filter Buttons */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 24px;
      border: 2px solid #22c55e;
      background-color: transparent;
      color: #22c55e;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    /* CSS Hover Effect for Buttons */
    .btn:hover, .btn.active {
      background-color: #22c55e;
      color: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
    }

    /* 2. Gallery & CSS Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card Item */
    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* CSS Hover Effect for Cards */
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(34, 197, 94, 0.25);
      border-color: #22c55e;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 20px;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Tag Colors per Category */
    .carnivore .card-tag { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .herbivore .card-tag { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; }
