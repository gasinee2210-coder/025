<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Recommendation Gallery</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sukhumvit Tadmai', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      padding: 20px;
    }

    /* 1. Header Section */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #a855f7;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.1rem;
      color: #94a3b8;
    }

    /* Filter Buttons */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 24px;
      border: 2px solid #a855f7;
      background-color: transparent;
      color: #a855f7;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    /* CSS Hover Effect for Buttons */
    .btn:hover, .btn.active {
      background-color: #a855f7;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }

    /* 2. Gallery & CSS Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card Item */
    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* CSS Hover Effect for Cards */
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(168, 85, 247, 0.25);
      border-color: #a855f7;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 20px;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Genre Tag Colors */
    .pop .card-tag { background-color: rgba(236, 72, 153, 0.2); color: #ec4899; }
    .rock .card-tag { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .hiphop .card-tag { background-color: rgba(234, 179, 8, 0.2); color: #eab308; }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 4px;
      color: #f1f5f9;
    }

    .card-artist {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .card-text {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    /* JS Filter Hide Class */
    .hide {
      display: none;
    }

    /* Responsive adjustments for small devices */
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }
      .btn {
        padding: 8px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Header Section -->
  <header>
    <h1>MY MUSIC PLAYLIST</h1>
    <p>รวมเพลงโปรดน่าฟัง แนะนำตามแนวเพลง Pop, Rock และ Hip-Hop</p>
  </header>

  <!-- Filter Buttons (3 หมวดหมู่ + ปุ่ม "ทั้งหมด") -->
  <div class="filter-container">
    <button class="btn active" onclick="filterGallery('all', event)">ทั้งหมด</button>

    <button class="btn" onclick="filterGallery('rock', event)">Rock</button>
    <button class="btn" onclick="filterGallery('hiphop', event)">Hip-Hop</button>
  </div>
